<div class="dr-cover"><h1 class="dr-title">京都三日，坂道与黄昏</h1><p class="dr-date">2026-03-15 ~ 2026-03-17</p><div class="dr-line"></div></div><div class="cs-sheet"><div class="cs-row"><div class="cs-cell"><img src="assets/photo_0001.jpg" data-photo-id="photo_0001" loading="lazy" decoding="async" alt="京都駅钢架穹顶下，到达的第一张，人群还裹着冬衣。" class="cs-img"></div><div class="cs-cell"><img src="assets/photo_0002.jpg" data-photo-id="photo_0002" loading="lazy" decoding="async" alt="酒店窗外：连片灰屋顶、车站的铁道场，再远是一线浅山。" class="cs-img"></div><div class="cs-cell"><img src="assets/photo_0005.jpg" data-photo-id="photo_0005" loading="lazy" decoding="async" alt="街角一抬头就是京都塔，出租车排成一列，路边的树还光着枝。" class="cs-img"></div></div><div class="cs-row"><div class="cs-cell"><img src="assets/photo_0006.jpg" data-photo-id="photo_0006" loading="lazy" decoding="async" alt="鴨川的黄昏，人沿河岸坐成一长排，对岸町屋的灯在水面上发抖。" class="cs-img"></div><div class="cs-cell"><img src="assets/photo_0007.jpg" data-photo-id="photo_0007" loading="lazy" decoding="async" alt="酒店桌上的便利店晚饭——饭团、便当、玄米茶，和一堆充电线、小票。" class="cs-img"></div><div class="cs-cell"><img src="assets/photo_0010.jpg" data-photo-id="photo_0010" loading="lazy" decoding="async" alt="京都駅地下美食层，背着包、拖着箱子挑便当的一对。" class="cs-img"></div></div></div><div class="cs-sheet"><div class="cs-row"><div class="cs-cell"><img src="assets/photo_0011.jpg" data-photo-id="photo_0011" loading="lazy" decoding="async" alt="清水寺仁王門和朱红三重塔，台阶上挤满人，樱花刚开了个头。" class="cs-img"></div><div class="cs-cell"><img src="assets/photo_0012.jpg" data-photo-id="photo_0012" loading="lazy" decoding="async" alt="清水の舞台，木栏外是整座京都，远处京都塔细得像根针。" class="cs-img"></div><div class="cs-cell"><img src="assets/photo_0013.jpg" data-photo-id="photo_0013" loading="lazy" decoding="async" alt="産寧坂的石阶，半路一树樱，店门口挂着白纸伞。" class="cs-img"></div></div><div class="cs-row"><div class="cs-cell"><img src="assets/photo_0014.jpg" data-photo-id="photo_0014" loading="lazy" decoding="async" alt="二年坂的陶器店，蓝白饭碗在木桌上摞成小山。" class="cs-img"></div><div class="cs-cell"><img src="assets/photo_0015.jpg" data-photo-id="photo_0015" loading="lazy" decoding="async" alt="绿釉碗里的抹茶，旁边一只樱花形的和菓子，窗外是青苔。" class="cs-img"></div><div class="cs-cell"><img src="assets/photo_0016.jpg" data-photo-id="photo_0016" loading="lazy" decoding="async" alt="寺院的枯山水，白砂耙出纹路，人坐在阴影里的木廊上，墙在晒太阳。" class="cs-img"></div></div><div class="cs-row"><div class="cs-cell"><img src="assets/photo_0018.jpg" data-photo-id="photo_0018" loading="lazy" decoding="async" alt="八坂の塔在落日里成了剪影，民居屋顶连成一片，店口的灯笼亮起。" class="cs-img"></div><div class="cs-cell"><img src="assets/photo_0019.jpg" data-photo-id="photo_0019" loading="lazy" decoding="async" alt="祇園的小巷，一盏圆纸灯笼、一辆停着的自行车，湿石板把光照回来。" class="cs-img"></div><div class="cs-cell"><img src="assets/photo_0020.jpg" data-photo-id="photo_0020" loading="lazy" decoding="async" alt="手拭巾铺子，藤花、金鱼、猫头鹰的花样在木台上摊开。" class="cs-img"></div></div></div><div class="cs-sheet"><div class="cs-row"><div class="cs-cell"><img src="assets/photo_0021.jpg" data-photo-id="photo_0021" loading="lazy" decoding="async" alt="竹林の道，竹子在头顶合拢，光是绿的，人顺着木栏往里走。" class="cs-img"></div><div class="cs-cell"><img src="assets/photo_0022.jpg" data-photo-id="photo_0022" loading="lazy" decoding="async" alt="渡月橋横过桂川，木栏一路弯到对岸的山脚下。" class="cs-img"></div><div class="cs-cell"><img src="assets/photo_0023.jpg" data-photo-id="photo_0023" loading="lazy" decoding="async" alt="桂川的河岸，水是冷青绿色，几条带篷的游船浮着，对岸坡上点着樱。" class="cs-img"></div></div><div class="cs-row"><div class="cs-cell"><img src="assets/photo_0025.jpg" data-photo-id="photo_0025" loading="lazy" decoding="async" alt="湯豆腐的昼饭，砂锅在小火上冒泡，配米饭、湯叶和一桌小碟。" class="cs-img"></div><div class="cs-cell"><img src="assets/photo_0026.jpg" data-photo-id="photo_0026" loading="lazy" decoding="async" alt="苔生的小寺，茅葺的门里一条石径，光从竹叶间漏下来。" class="cs-img"></div><div class="cs-cell"><img src="assets/photo_0028.jpg" data-photo-id="photo_0028" loading="lazy" decoding="async" alt="紫色的嵐電过小路口，住宅区安安静静，路边一树樱花开着。" class="cs-img"></div></div><div class="cs-row"><div class="cs-cell"><img src="assets/photo_0029.jpg" data-photo-id="photo_0029" loading="lazy" decoding="async" alt="京都駅的站台，蓝色时刻里新干线停着，旅人沿黄线排队。" class="cs-img"></div><div class="cs-cell"><img src="assets/photo_0030.jpg" data-photo-id="photo_0030" loading="lazy" decoding="async" alt="从高处看京都駅的大堂，夜里店铺都亮着，钢架顶罩住整片光。" class="cs-img"></div></div></div>
